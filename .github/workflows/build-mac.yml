name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build macOS DMG & ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller Pillow

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm & build frontend
        run: |
          npm install
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Compile Python backend
        run: |
          pyinstaller backend.spec --distpath dist-backend --workpath build-backend --noconfirm
          chmod +x dist-backend/backend

      - name: Package macOS app with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --mac dmg zip --publish never

      - name: Upload macOS Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-TG-Harvester-macOS
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
