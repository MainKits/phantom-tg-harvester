name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller httpx tiktok-uploader playwright Pillow
          playwright install chromium

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies and build frontend
        run: |
          npm install
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Compile Python backend (backend.exe)
        run: |
          pyinstaller backend.spec --distpath dist-backend --workpath build-backend --noconfirm

      - name: Package Windows Installer (.exe) with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64 --publish never

      - name: Upload Windows Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-TG-Harvester-Windows-Installer
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
